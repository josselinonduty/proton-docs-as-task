<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board Playground</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #f5f4f2;
        color: #0c0c14;
      }
      .pg-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #eae7e4;
        font-size: 14px;
      }
      .pg-muted {
        color: #5c5958;
      }
      .pg-spacer {
        flex: 1;
      }
      .pg-doc {
        max-width: 820px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .pg-doc textarea {
        width: 100%;
        min-height: 60vh;
        box-sizing: border-box;
        padding: 40px 56px;
        border: 1px solid #eae7e4;
        border-radius: 8px;
        background: #fff;
        font:
          15px/1.6 Arial,
          sans-serif;
      }
      .pg-settings {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 16px;
        font-size: 14px;
      }
      .pg-settings h2 {
        width: 100%;
        margin: 0;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <div id="overlay"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
