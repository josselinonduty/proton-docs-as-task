name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # WXT derives the manifest version from package.json, so the tag and
      # package.json must agree. Fail fast if they drift.
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=> $tag_version) does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Package (Chrome)
        run: npm run zip

      - name: Package (Firefox)
        run: npm run zip:firefox

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
