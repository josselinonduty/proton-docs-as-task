name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # WXT derives the manifest version from package.json, so the tag and
      # package.json must agree. Fail fast if they drift.
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=> $tag_version) does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Package (Chrome)
        run: npm run zip

      # --sources bundles the source tree alongside the Firefox package,
      # which AMO review requires for extensions built with a bundler.
      - name: Package (Firefox)
        run: npm run zip:firefox -- --sources

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip

      # Store credentials are optional: until they're configured as repo
      # secrets, the release still builds and publishes to GitHub, it just
      # skips the store submissions instead of failing the whole run.
      - name: Check for Chrome Web Store credentials
        id: chrome-creds
        run: echo "present=${{ secrets.CHROME_EXTENSION_ID != '' && secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check for Firefox Add-ons credentials
        id: firefox-creds
        run: echo "present=${{ secrets.FIREFOX_EXTENSION_ID != '' && secrets.FIREFOX_JWT_ISSUER != '' && secrets.FIREFOX_JWT_SECRET != '' }}" >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store
        if: steps.chrome-creds.outputs.present == 'true'
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Firefox Add-ons
        if: steps.firefox-creds.outputs.present == 'true'
        run: npx wxt submit --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
