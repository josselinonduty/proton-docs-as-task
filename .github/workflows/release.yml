name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # WXT derives the manifest version from package.json, so the tag and
      # package.json must agree. Fail fast if they drift.
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=> $tag_version) does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Package (Chrome)
        run: npm run zip

      - name: Package (Firefox)
        run: npm run zip:firefox

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87 # v2.0.5
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
