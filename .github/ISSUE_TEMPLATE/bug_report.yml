name: Bug report
description: Something in the extension does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [open issues](https://github.com/josselinonduty/proton-docs-as-task/issues?q=is%3Aissue) first.
        Security problem? Use the private link on the previous page instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot helps, but hide private task content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a document with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on your browser's extensions page.
      placeholder: '1.2.2'
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
        - Edge
        - Brave
        - Other Chromium-based
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version and OS
      placeholder: 'Firefox 140 on Ubuntu 24.04'
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Console errors, the Markdown of the affected checklist lines, whether it worked on an earlier version.
