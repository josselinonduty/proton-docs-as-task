name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This is a focused project, so the problem matters more than the solution.
        Please check the [open issues](https://github.com/josselinonduty/proton-docs-as-task/issues?q=is%3Aissue) first.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or task you are stuck on, and why the extension does not cover it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your idea, if you have one. A sketch or example is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds or other tools you use for this.
