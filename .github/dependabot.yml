version: 2
updates:
  # npm dependencies (React, WXT, tooling).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Let new releases age before proposing them: compromised versions are
    # usually caught and unpublished within days.
    cooldown:
      default-days: 7
    groups:
      # Batch routine dev-tooling bumps into a single PR to cut noise.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
